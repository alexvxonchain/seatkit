<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SEATKIT · composite</title>
  <style>
    html, body {
      margin: 0; width: 1080px; height: 1350px; overflow: hidden;
      background: #050403; color: #ffb84a;
      font-family: Consolas, "Segoe UI", monospace;
    }
    #wrap {
      width: 1080px; height: 1350px; position: relative;
      display: grid;
      grid-template-rows: 1fr 420px;
    }
    #uiFrame {
      width: 1080px; height: 930px; border: 0; display: block;
      background: #070605;
    }
    #bottom {
      position: relative;
      height: 420px;
      border-top: 1px solid rgba(255,184,74,0.45);
      overflow: hidden;
    }
    #c {
      position: absolute; inset: 0;
      width: 1080px; height: 420px; display: block;
    }
    #caption {
      position: absolute; left: 18px; right: 18px; bottom: 14px; z-index: 3;
      display: flex; justify-content: space-between; align-items: flex-end;
      pointer-events: none;
    }
    #caption .big {
      font-size: 28px; font-weight: 800; color: #ffc45c;
      text-shadow: 0 0 16px rgba(255,170,60,0.4);
    }
    #caption .sub { font-size: 13px; color: #c9a06a; margin-top: 4px; }
    #caption .right { text-align: right; font-size: 12px; color: #c9a06a; }
    #badge {
      position: absolute; top: 12px; left: 14px; z-index: 3;
      background: rgba(5,4,3,0.75); border: 1px solid rgba(255,184,74,0.45);
      padding: 6px 10px; font-size: 11px; letter-spacing: 0.6px;
    }
  </style>
  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
  <div id="wrap">
    <iframe id="uiFrame" src="/?demo=1" title="SEATKIT"></iframe>
    <div id="bottom">
      <div id="badge">3D SEAT FIELD · LIVE</div>
      <canvas id="c"></canvas>
      <div id="caption">
        <div>
          <div class="big" id="line">npm start → YOUR SEAT</div>
          <div class="sub" id="sub">paper desk on pump.fun trench</div>
        </div>
        <div class="right">
          <div>github.com/alexvxonchain/seatkit</div>
          <div id="tick">T+0.0</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const DUR = 18;
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(1080, 420, false);
    renderer.setClearColor(0x050403, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1080 / 420, 0.1, 100);
    camera.position.set(0, 0.15, 5.2);

    // soft floor haze (no Christmas-tree cone)
    const hazeGeo = new THREE.PlaneGeometry(16, 8, 1, 1);
    const haze = new THREE.Mesh(
      hazeGeo,
      new THREE.MeshBasicMaterial({ color: 0x120c06, transparent: true, opacity: 0.55 })
    );
    haze.rotation.x = -Math.PI / 2;
    haze.position.y = -1.05;
    scene.add(haze);

    // Lemniscate of Bernoulli (∞) — parametric
    // x = a√2 cos(t) / (sin²(t)+1)
    // y = a√2 cos(t)sin(t) / (sin²(t)+1)
    function infinityPoint(u, a = 1.85) {
      const s = Math.sin(u);
      const c = Math.cos(u);
      const d = s * s + 1;
      const x = (a * Math.SQRT2 * c) / d;
      const y = (a * Math.SQRT2 * c * s) / d;
      return { x, y };
    }

    // ribbon tube along ∞
    const tubePts = [];
    for (let i = 0; i <= 240; i++) {
      const u = (i / 240) * Math.PI * 2;
      const p = infinityPoint(u);
      tubePts.push(new THREE.Vector3(p.x, p.y * 0.85, Math.sin(u * 2) * 0.12));
    }
    const curve = new THREE.CatmullRomCurve3(tubePts, true);
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 240, 0.035, 10, true),
      new THREE.MeshBasicMaterial({ color: 0xffb84a, transparent: true, opacity: 0.55 })
    );
    scene.add(tube);

    const tubeCore = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 240, 0.012, 8, true),
      new THREE.MeshBasicMaterial({ color: 0x55d4ff, transparent: true, opacity: 0.9 })
    );
    scene.add(tubeCore);

    // flowing particles ON the infinity path
    const N = 1600;
    const pos = new Float32Array(N * 3);
    const col = new Float32Array(N * 3);
    const phase = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      phase[i] = Math.random() * Math.PI * 2;
      const warm = Math.random();
      col[i * 3] = 0.7 + warm * 0.3;
      col[i * 3 + 1] = 0.4 + warm * 0.45;
      col[i * 3 + 2] = warm > 0.55 ? 0.85 : 0.18;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const flow = new THREE.Points(geo, new THREE.PointsMaterial({
      size: 0.045, vertexColors: true, transparent: true, opacity: 0.95, sizeAttenuation: true,
    }));
    scene.add(flow);

    // outer spark dust (sparse, not a mound)
    const M = 500;
    const dustPos = new Float32Array(M * 3);
    const dustCol = new Float32Array(M * 3);
    const dustBase = new Float32Array(M * 3);
    for (let i = 0; i < M; i++) {
      const u = Math.random() * Math.PI * 2;
      const p = infinityPoint(u, 2.35 + Math.random() * 0.5);
      dustBase[i * 3] = p.x;
      dustBase[i * 3 + 1] = p.y * 0.85 + (Math.random() - 0.5) * 0.35;
      dustBase[i * 3 + 2] = (Math.random() - 0.5) * 0.8;
      dustPos[i * 3] = dustBase[i * 3];
      dustPos[i * 3 + 1] = dustBase[i * 3 + 1];
      dustPos[i * 3 + 2] = dustBase[i * 3 + 2];
      dustCol[i * 3] = 1; dustCol[i * 3 + 1] = 0.75; dustCol[i * 3 + 2] = 0.35;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
      size: 0.02, vertexColors: true, transparent: true, opacity: 0.55, sizeAttenuation: true,
    }));
    scene.add(dust);

    // crossing node glow at center of ∞
    const node = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffe08a })
    );
    scene.add(node);

    // chips traveling along infinity
    const chips = [];
    const labels = ['∞ LOOP', 'PAPER', 'SEAT', 'HOST', 'npm'];
    labels.forEach((text, i) => {
      const cv = document.createElement('canvas');
      cv.width = 280; cv.height = 64;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(8, 10, 264, 44);
      ctx.strokeStyle = i === 0 ? '#55d4ff' : '#ffb84a';
      ctx.lineWidth = 2;
      ctx.strokeRect(8, 10, 264, 44);
      ctx.fillStyle = i === 0 ? '#55d4ff' : '#ffb84a';
      ctx.font = 'bold 26px Consolas';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 140, 32);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(cv), transparent: true, depthTest: false,
      }));
      sp.scale.set(1.05, 0.24, 1);
      scene.add(sp);
      chips.push({ sp, phase: (i / labels.length) * Math.PI * 2 });
    });

    const lines = [
      ['∞ SAME DESK. SAME LOOP.', 'seat → climb → fall → seat'],
      ['REAL TERMINAL UP TOP', 'infinity field below'],
      ['NO KEYS IN THE REPO', 'paper loop until you wire live'],
      ['SELF-HOSTED OPERATOR SEAT', 'github.com/alexvxonchain/seatkit'],
    ];

    document.getElementById('badge').textContent = '3D ∞ LOOP · LIVE';

    window.__RADIX__ = { t: 0, ready: false, DUR };
    let start = performance.now();
    let recording = false;

    function renderAt(t) {
      window.__RADIX__.t = t;

      // flow along ∞
      const arr = geo.attributes.position.array;
      for (let i = 0; i < N; i++) {
        const u = phase[i] + t * (1.15 + (i % 5) * 0.04);
        const p = infinityPoint(u);
        const wobble = 0.04 * Math.sin(t * 3 + i);
        arr[i * 3] = p.x + wobble * Math.cos(u);
        arr[i * 3 + 1] = p.y * 0.85 + wobble * 0.5;
        arr[i * 3 + 2] = Math.sin(u * 2 + t) * 0.14;
      }
      geo.attributes.position.needsUpdate = true;

      const darr = dustGeo.attributes.position.array;
      for (let i = 0; i < M; i++) {
        darr[i * 3] = dustBase[i * 3] + Math.sin(t * 0.8 + i) * 0.03;
        darr[i * 3 + 1] = dustBase[i * 3 + 1] + Math.cos(t * 1.1 + i * 0.2) * 0.04;
        darr[i * 3 + 2] = dustBase[i * 3 + 2];
      }
      dustGeo.attributes.position.needsUpdate = true;

      tube.rotation.z = Math.sin(t * 0.25) * 0.08;
      tubeCore.rotation.z = tube.rotation.z;
      node.scale.setScalar(1 + 0.25 * Math.sin(t * 4));

      chips.forEach(({ sp, phase: ph }) => {
        const u = ph + t * 0.55;
        const p = infinityPoint(u, 1.85);
        sp.position.set(p.x, p.y * 0.85 + 0.18, 0.25);
      });

      camera.position.x = Math.sin(t * 0.22) * 0.45;
      camera.position.y = 0.2 + Math.sin(t * 0.3) * 0.12;
      camera.position.z = 5.0 + Math.cos(t * 0.18) * 0.25;
      camera.lookAt(0, 0, 0);

      const li = Math.min(lines.length - 1, Math.floor(t / (DUR / lines.length)));
      document.getElementById('line').textContent = lines[li][0];
      document.getElementById('sub').textContent = lines[li][1];
      document.getElementById('tick').textContent = `T+${t.toFixed(1)}`;

      renderer.render(scene, camera);
    }

    window.__setTime = (tt) => { recording = true; renderAt(tt); };
    window.__RADIX_RESTART__ = () => {
      recording = false;
      start = performance.now();
      renderAt(0);
      try {
        const f = document.getElementById('uiFrame');
        f.src = '/?demo=1&r=' + Date.now();
      } catch {}
    };

    function frame(now) {
      if (recording) return;
      renderAt(Math.min(DUR, (now - start) / 1000));
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(() => {
      window.__RADIX__.ready = true;
      start = performance.now();
      renderAt(0);
      requestAnimationFrame(frame);
    });
  </script>
</body>
</html>
